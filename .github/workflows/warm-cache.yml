name: warm-cache

# Release builds run on tags, and tags can only restore caches created on the
# default branch. This workflow compiles the release build on main (without
# bundling) so `pnpm release` finds every dependency already built.
on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - src-tauri/tauri.conf.json
      - .github/workflows/**
  # GitHub evicts caches unused for 7 days.
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch:

concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        # Must match the bundle matrix in build.yml (same shared-key names).
        include:
          - name: windows-x64
            platform: windows-latest
            args: ""
            rust-target: ""
          - name: macos-arm64
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-target: aarch64-apple-darwin
          - name: macos-x64
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-target: x86_64-apple-darwin
          - name: linux-x64
            platform: ubuntu-22.04
            args: ""
            rust-target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same cargo invocation as a release (features, profile, target), no installers.
      - run: pnpm tauri build --no-bundle ${{ matrix.args }}

  # The repo has 10 GB of cache. Every release changes Cargo.lock (version
  # bump), so each one adds a new ~4 GB set of caches next to the old ones,
  # and GitHub then evicts by age, possibly the fresh ones above. Keep only
  # the newest cache of each kind on main, and drop caches saved by tag
  # builds (no later tag can read them).
  prune:
    needs: warm
    # Also after a failed platform: its old cache stays, being its newest.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete outdated caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id, .ref, .key, .created_at] | @tsv' > caches.tsv
          tab="$(printf '\t')"
          {
            # Saved by tag builds.
            awk -F'\t' '$2 ~ /refs\/tags\// { print $1 }' caches.tsv
            # On main, all but the newest per key without its last part
            # (rust-cache and setup-node end their keys with a lockfile hash).
            awk -F'\t' '$2 == "refs/heads/main" { p = $3; sub(/-[^-]*$/, "", p); print p "\t" $4 "\t" $1 }' caches.tsv \
              | sort -t "$tab" -k1,1 -k2,2r \
              | awk -F'\t' 'seen[$1]++ { print $3 }'
          } > delete.txt
          echo "Deleting $(wc -l < delete.txt) of $(wc -l < caches.tsv) caches"
          while read -r id; do
            gh api -X DELETE "repos/$REPO/actions/caches/$id" > /dev/null && echo "deleted $id"
          done < delete.txt
