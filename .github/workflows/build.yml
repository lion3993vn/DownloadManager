name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p dm-core -p dm-cli

  bundle:
    needs: test
    # Needed to create the GitHub release and upload installers on tags
    # (new repositories give GITHUB_TOKEN read-only access by default).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The CHANGELOG section becomes the release body and the notes inside
      # latest.json (shown by the in-app updater).
      - name: Release notes from CHANGELOG.md
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          {
            echo 'body<<__RELEASE_NOTES__'
            node scripts/release-notes.mjs "$GITHUB_REF_NAME" --changes-only
            echo '__RELEASE_NOTES__'
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and generates latest.json for in-app updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: ${{ matrix.args }}
          # Draft release with installers when a v* tag is pushed.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: DownloadManager ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: ${{ steps.notes.outputs.body }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: target/**/release/bundle/**

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/pack-extension.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: dist-extension/*.zip

  # After every platform is built: attach the extension, write the full
  # release description (changelog + download table + SHA-256) and publish.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: browser-extension
          path: assets
      - name: Download installers from the draft release
        run: gh release download "$GITHUB_REF_NAME" --dir assets --clobber
      - name: Attach the browser extension
        run: gh release upload "$GITHUB_REF_NAME" assets/downloadmanager-extension-*.zip --clobber
      - name: Write release notes and publish
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" --assets assets > notes.md
          gh release edit "$GITHUB_REF_NAME"             --title "DownloadManager $GITHUB_REF_NAME"             --notes-file notes.md             --draft=false --latest
