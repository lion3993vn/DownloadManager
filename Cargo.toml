[workspace]
resolver = "2"
members = ["crates/dm-core", "crates/dm-cli", "src-tauri"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
axum = "0.8"
bytes = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
